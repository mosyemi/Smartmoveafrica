name: smartmoveafrica
description: Integrated Smart Transport & Mobility Monitoring Platform for Africa
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^17.2.3

  # State Management
  flutter_riverpod: ^3.3.1

  # HTTP & API
  dio: ^5.4.0

  # Maps
  google_maps_flutter: ^2.5.0
  flutter_map: ^8.3.0

  # Location / GPS
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # Local Storage
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^10.1.0

  # Notifications
  firebase_messaging: ^16.2.0
  flutter_local_notifications: ^21.0.0

  # UI & Icons
  flutter_svg: ^2.0.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  lottie: ^3.0.0
  smooth_page_indicator: ^2.0.1

  # Utils
  intl: ^0.20.2
  connectivity_plus: ^7.1.1
  permission_handler: ^12.0.1
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
